name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or publish
        required: true
        type: string
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion
      - name: Resolve Lithe Core source with structured logging
        id: core
        if: hashFiles('scripts/prepare-core.mjs') != ''
        run: node -e 'const s=require("./sdk.lock.json").coreSource; console.log(`repository=${new URL(s.repository).pathname.slice(1)}\nrevision=${s.ref}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.core.outputs.revision != ''
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.revision }}
          path: .artifacts/lithe-core
          sparse-checkout: |
            rust
            shared
          persist-credentials: false
      - name: Verify Core prerequisite and build Core bridge
        if: steps.core.outputs.revision != ''
        run: node scripts/prepare-core.mjs
      - name: Verify, test and package
        env:
          LITHE_SVN_INTEGRATION: '1'
        run: |
          node scripts/verify-sdk.mjs --download
          if [ -f scripts/test.mjs ]; then
            node scripts/test.mjs
          else
            # Historical tags retain their own test procedure.
            node --test test/*.test.mjs
          fi
          node scripts/package.mjs --expect-tag "$RELEASE_TAG"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A maintainer may have uploaded an immutable release before this
          # tag run starts. Verify the published bytes without replacing them.
          if gh release view "$RELEASE_TAG" --json url > "$RUNNER_TEMP/existing-release.json"; then
            archive="svn-support-${RELEASE_TAG#v}-darwin.zip"
            mkdir -p "$RUNNER_TEMP/published"
            gh release download "$RELEASE_TAG" --pattern "$archive" --pattern "$archive.sha256" --dir "$RUNNER_TEMP/published"
            (cd "$RUNNER_TEMP/published" && sha256sum --check "$archive.sha256")
            echo "Existing release verified; its assets remain unchanged."
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          macOS Subversion provider for Lithe Desktop 0.8.20+ (declarative plugin contract v0: `schemaVersion: 0`, `pluginAPIVersion: 0`, `requires: { "vcsProviders": 0 }`) with structured plugin diagnostics (`litheLogging: 0`). Eligible for Lithe Store.

          Changes in 0.1.4:
          - Migrated `plugin.json` to the v0 plugin contract (`schemaVersion: 0`, `pluginAPIVersion: 0`, `requires: { "vcsProviders": 0 }`, `requiresTools: ["node"]`).
          - Updated the vendored official Node.js SDK to 0.5.0 (`sdk-node-v0.5.0` from `Lithe-IDEA/Lithe-core-rust`), speaking `litheLogging: 0` and `litheVcs: 0` cleanly with Lithe Desktop 0.8.20+ and Rust Core.
          - Fixed `scripts/prepare-core.mjs` to build the Core test harness through Cargo instead of manual `rustc` crate linking, and updated the Core integration test for workspace trust and tool launch plans.
          - Switched the release workflow to publish stable GitHub Releases eligible for Lithe Store.

          Requires Subversion 1.8+ and Node.js 20.3+, both user-provided. Windows is not supported. Published ZIP bytes must not be replaced.
          NOTES
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --title "Subversion $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests
          path: |
            .artifacts/test-stability/
            .artifacts/core-target/build.log
          retention-days: 7
