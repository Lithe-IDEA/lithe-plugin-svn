name: Release preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or publish
        required: true
        type: string
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion
      - name: Resolve latest host preview with structured logging
        id: core
        if: hashFiles('scripts/prepare-core.mjs') != ''
        run: node -e 'const s=require("./sdk.lock.json").coreSource; console.log(`repository=${new URL(s.repository).pathname.slice(1)}\nrevision=${s.ref}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.core.outputs.revision != ''
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.revision }}
          path: .artifacts/lithe-core
          sparse-checkout: |
            rust
            shared
          persist-credentials: false
      - name: Verify host prerequisite and build Core bridge
        if: steps.core.outputs.revision != ''
        run: node scripts/prepare-core.mjs
      - name: Verify, test and package
        env:
          LITHE_SVN_INTEGRATION: '1'
        run: |
          node scripts/verify-sdk.mjs --download
          if [ -f scripts/test.mjs ]; then
            node scripts/test.mjs
          else
            # Historical tags retain their own test procedure.
            node --test test/*.test.mjs
          fi
          node scripts/package.mjs --expect-tag "$RELEASE_TAG"
      - name: Publish immutable preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A maintainer may have uploaded an immutable release before this
          # tag run starts. Verify the published bytes without replacing them.
          if gh release view "$RELEASE_TAG" --json url > "$RUNNER_TEMP/existing-release.json"; then
            archive="svn-support-${RELEASE_TAG#v}-darwin.zip"
            mkdir -p "$RUNNER_TEMP/published"
            gh release download "$RELEASE_TAG" --pattern "$archive" --pattern "$archive.sha256" --dir "$RUNNER_TEMP/published"
            (cd "$RUNNER_TEMP/published" && sha256sum --check "$archive.sha256")
            echo "Existing release verified; its assets remain unchanged."
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          macOS Subversion provider for a Lithe preview whose host declares API 3 vcsProviders 1 and serverProcess 1 and offers structured plugin diagnostics (litheLogging 1). Stable Lithe 0.6.7 does not offer litheLogging 1 and cannot start this version; keep using 0.1.0 there.

          Changes in 0.1.2:
          - The bundled Node.js SDK is now the officially released SDK 0.3.0, pinned by tag (sdk-node-v0.3.0) and SHA-256 in sdk.lock.json instead of a local copy. The vendored files are the release's files without local edits. Provider behavior is unchanged.
          - It still requires a Lithe preview build offering litheLogging 1; stable Lithe 0.6.7 users stay on 0.1.0.

          Requires Subversion 1.8+ and Node.js 20.3+, both user-provided. Not listed in Lithe Store yet; download the ZIP and install it from disk.

          Preview status: automated Core integration and svn scenario checks pass; native installation and full UI acceptance are pending. Windows is not supported. Published ZIP bytes must not be replaced.
          NOTES
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --prerelease --title "Subversion $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Require the release to be a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release of this workflow needs a host offering litheLogging 1,
          # so it must stay a prerelease: Lithe Store skips prereleases. A
          # release has ended up as a normal one despite --prerelease before,
          # so read the flag back, correct it, and fail if it still is not set.
          is_prerelease() { gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease; }
          if [ "$(is_prerelease)" != "true" ]; then
            echo "::warning::Release $RELEASE_TAG is not marked as a prerelease; correcting it."
            gh release edit "$RELEASE_TAG" --prerelease
            if [ "$(is_prerelease)" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is still not marked as a prerelease."
              exit 1
            fi
          fi
          echo "Release $RELEASE_TAG is a prerelease."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests
          path: |
            .artifacts/test-stability/
            .artifacts/core-target/build.log
          retention-days: 7
